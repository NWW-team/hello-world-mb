<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello, Vibecoden!</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f172a;
      --bg-card: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #a78bfa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top, #1e293b, #0f172a 70%);
      color: var(--text);
    }

    .card {
      max-width: 480px;
      width: 100%;
      background: var(--bg-card);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
      padding: 0.3rem 0.8rem;
      border-radius: 999px;
      margin-bottom: 1.25rem;
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: 2rem;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p {
      margin: 0 0 0.5rem;
      color: var(--muted);
      line-height: 1.6;
    }

    .emoji {
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }

    footer {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: var(--muted);
    }

    @media (max-width: 400px) {
      h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="emoji">✨</div>
    <span class="badge">Vibecoden</span>
    <h1>Hello, World!</h1>
    <p>Dit is een piepklein voorbeeld van "vibecoden": snel iets bouwen door met een AI samen te werken en het resultaat meteen te bekijken in de browser.</p>
    <p>Geen build-stap, geen server nodig &mdash; gewoon HTML en CSS in één bestand.</p>
    <footer>Gemaakt tijdens een vibecode-sessie 🚀</footer>
  </main>
</body>
</html>
